# Server Configuration
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=60s

# AWS Configuration
aws.region=${AWS_REGION:eu-west-2}

# MQ Secrets Configuration
mq.username.secret.name=${MQ_USERNAME_SECRET_NAME:MessagingStack-MessagingMqUsername}
mq.password.secret.name=${MQ_PASSWORD_SECRET_NAME:MessagingStack-MessagingMqPassword}

# Spring Retry Configuration
spring.retry.enabled=true

# JMS Configuration for optimal retry behavior
spring.jms.listener.auto-startup=true
spring.jms.listener.acknowledge-mode=client

# Detailed Logging Configuration
logging.level.com.example.reactive.MessageService=DEBUG
logging.level.com.example.reactive.JmsConfig=INFO
logging.level.org.springframework.jms=DEBUG
logging.level.org.springframework.retry=DEBUG
logging.level.org.apache.activemq=INFO

# Application-specific settings
app.jms.queue.name=item.queue
app.jms.dlq.name=ActiveMQ.DLQ
app.jms.retry.max-attempts=3
app.jms.retry.initial-delay=1000
app.jms.retry.max-delay=10000
app.jms.retry.multiplier=2.0